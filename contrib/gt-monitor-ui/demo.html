<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gt-monitor-ui Demo</title>
  <script type="module" src="src/index.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #010409;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #8b949e;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .full-width {
      grid-column: 1 / -1;
    }
    .config {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .config label {
      font-size: 13px;
      color: #8b949e;
    }
    .config input {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #e6edf3;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 13px;
      flex: 1;
    }
    .config button {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 13px;
    }
    .config button:hover { background: #2ea043; }
  </style>
</head>
<body>
  <h1>gt-monitor-ui</h1>
  <p class="subtitle">Web Components widgets for gt-monitor API</p>

  <div class="config">
    <label for="endpoint">API Endpoint:</label>
    <input id="endpoint" type="text" value="http://100.108.196.44:9090/v1" />
    <button onclick="updateEndpoint()">Connect</button>
  </div>

  <div class="grid">
    <gt-cost-tracker id="w-cost"></gt-cost-tracker>
    <gt-system-vitals id="w-vitals"></gt-system-vitals>
    <gt-agent-grid id="w-agents" class="full-width"></gt-agent-grid>
    <gt-commit-heatmap id="w-heatmap" class="full-width"></gt-commit-heatmap>
    <gt-command-metrics id="w-commands"></gt-command-metrics>
    <gt-changelog id="w-changelog"></gt-changelog>
    <gt-wasteland-board id="w-wasteland" class="full-width"></gt-wasteland-board>
    <gt-bead-list id="w-beads" class="full-width"></gt-bead-list>
    <gt-knowledge-graph-3d id="w-graph" class="full-width"></gt-knowledge-graph-3d>
  </div>

  <script>
    function updateEndpoint() {
      const ep = document.getElementById('endpoint').value;
      document.querySelectorAll('[id^="w-"]').forEach(w => {
        w.setAttribute('endpoint', ep);
      });
    }
    // Set initial endpoint
    updateEndpoint();
  </script>
</body>
</html>
